# qday2-testnet — Validium L2 (zkrollup, external L1 + cdk-node)
#
# Sequencer node only — sole block producer + datastream server.
#   sequencer  — block producer + datastream server  (RPC :8123, datastream :6900)
#
# Settles to an EXTERNAL L1 and is orchestrated by an EXTERNAL cdk-node
# (both deployed by other projects). This stack runs neither cdk-dac nor AggLayer.
# The cdk-node consumes the sequencer's datastream (:6900) and posts batches to L1.
#
# RPC nodes live in docker-compose.rpc.yml and connect to this sequencer's datastream.
#
# Setup:
#   cp env.example .env
#   docker compose pull
#   docker compose up

x-cdk-erigon-base: &cdk-erigon-base
  image: ${CDK_ERIGON_IMAGE}
  restart: unless-stopped
  mem_swappiness: 0
  # entrypoint chowns /data then drops to erigon (UID 1000)
  user: root
  entrypoint: ["/bin/sh", "/config/docker-entrypoint.sh"]

services:
  # ─────────────────────────────────────────────
  #  Sequencer — sole block producer
  #  Exposes datastream on :6900 for RPC nodes
  # ─────────────────────────────────────────────
  sequencer:
    <<: *cdk-erigon-base
    container_name: qday2-sequencer
    environment:
      - CDK_ERIGON_SEQUENCER=1
    command:
      - --config=/config/dynamic-validium.yaml
      # override relative paths from yaml
      - --datadir=/data
      - --zkevm.initial-batch.config=/config/empty-batch.json
      # external L1 endpoint (overrides yaml; sourced from .env)
      - --zkevm.l1-rpc-url=${L1_RPC_URL:-http://host.docker.internal:31337}
      - --zkevm.l1-chain-id=${L1_CHAIN_ID:-31337}
    volumes:
      - ./:/config:ro
      - ./datadir-validium:/data
    extra_hosts:
      # allow host.docker.internal to resolve to the Docker host (Linux)
      # needed to reach the external L1 at host.docker.internal:<port>
      - "host.docker.internal:host-gateway"
    ports:
      - "${SEQUENCER_RPC_PORT:-8123}:8123"     # HTTP JSON-RPC + WebSocket
      - "${SEQUENCER_DATASTREAM_PORT:-6900}:6900" # Datastream (consumed by RPC nodes)
    healthcheck:
      test: ["CMD", "sh", "-c",
        "curl -sf -X POST http://localhost:8123 -H 'Content-Type: application/json' \
         -d '{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}' \
         | grep -q result"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
